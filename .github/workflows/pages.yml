name: Deploy LEEBaz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild and validate the static site archive
        run: |
          cat parts/part*.bin > site.zip
          unzip -t site.zip
          mkdir -p dist
          unzip -q site.zip -d dist
          test -s dist/index.html
          touch dist/.nojekyll
          echo "Extracted files:"
          find dist -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
