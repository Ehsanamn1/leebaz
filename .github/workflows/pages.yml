name: Deploy LEEBaz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and prepare the standalone storefront
        run: |
          test -s index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          source = Path("index.html").read_text(encoding="utf-8")
          assert '<html lang="fa" dir="rtl">' in source, "Expected Persian RTL document"
          assert "</html>" in source, "HTML document appears incomplete"

          class StorefrontParser(HTMLParser):
              pass

          parser = StorefrontParser()
          parser.feed(source)
          parser.close()

          assert "data:image/" in source, "Expected embedded storefront images"
          print(f"Validated standalone storefront: {len(source.encode('utf-8'))} bytes")
          PY
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
          test -s dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
